<script>
        // A reset link without a token is dead on arrival: tell the user
        // immediately (with a way back) instead of letting them fill the form
        // only to hit the error at submit time.
        (function () {
            var t = new URLSearchParams(window.location.search).get("token");
            if (t) return;
            window.addEventListener("DOMContentLoaded", function () {
                var em = document.getElementById("password-error");
                var rec = document.getElementById("token-error-recovery");
                if (em) { em.textContent = "Invalid or missing reset token. Please request a new password reset."; em.classList.remove("hidden"); }
                if (rec) rec.classList.remove("hidden");
                var btn = document.querySelector("button[type=submit]");
                if (btn) { btn.disabled = true; btn.style.opacity = "0.6"; }
            });
        })();

        async function handleResetPassword(event) {
            event.preventDefault();
            const passwordInput = document.getElementById('new-password');
            const confirmInput = document.getElementById('confirm-password');
            const errorMsg = document.getElementById('password-error');
            const successModal = document.getElementById('success-modal');
            const submitBtn = event.target.querySelector('button[type="submit"]');

            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;
            const token = new URLSearchParams(window.location.search).get('token') || '';

            // Hide error message initially
            errorMsg.classList.add('hidden');

            if (!password || !confirmPassword) {
                errorMsg.textContent = "Please fill in all fields";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.textContent = "Passwords do not match";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (password.length < 8) {
                errorMsg.textContent = "Password must be at least 8 characters";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (!token) {
                errorMsg.textContent = "Invalid or missing reset token. Please request a new password reset.";
                var recovery = document.getElementById("token-error-recovery");
                if (recovery) recovery.classList.remove("hidden");
                errorMsg.classList.remove('hidden');
                return;
            }

            // Disable button during request
            if (submitBtn) { submitBtn.disabled = true; submitBtn.style.opacity = '0.6'; submitBtn.textContent = 'RESETTING...'; }

            try {
                const response = await fetch('/api/auth/password-reset/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: password, confirm: confirmPassword })
                });
                const data = await response.json();

                if (data.success) {
                    // Show success modal
                    successModal.classList.remove('hidden');
                    successModal.classList.add('flex');
                } else {
                    errorMsg.textContent = data.error || 'Could not reset password. Please try again.';
                    errorMsg.classList.remove('hidden');
                    if (submitBtn) { submitBtn.disabled = false; submitBtn.style.opacity = '1'; submitBtn.textContent = 'RESET PASSWORD'; }
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.classList.remove('hidden');
                if (submitBtn) { submitBtn.disabled = false; submitBtn.style.opacity = '1'; submitBtn.textContent = 'RESET PASSWORD'; }
            }
        }

        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        function handleGoToLogin() {
            window.location.href = '/home5.html?signin=1';
        }
    </script>
